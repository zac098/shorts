<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fazer Pedido – Corte a Laser & Gravações</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Faça seu pedido</h1>
      <p>Envie seu pedido de <strong>corte a laser em MDF</strong> (chaveiros, gravação de fotos, etc.) e <strong>gravação em copos de ferro</strong>.</p>
    </header>

    <form id="pedidoForm" class="card" enctype="multipart/form-data">
      <fieldset class="grupo">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Ana Souza" required />
      </fieldset>

      <fieldset class="grupo">
        <label>Meio de contato</label>
        <div class="contato-opcoes" role="radiogroup" aria-label="Meio de contato">
          <label class="radio-icone">
            <input type="radio" name="contatoTipo" value="whatsapp" checked />
            <span class="bolinha" aria-hidden="true"></span>
            <span class="icone" title="WhatsApp" aria-hidden="true">
              <svg viewBox="0 0 32 32" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M19.11 17.33c-.28-.14-1.63-.8-1.88-.89-.25-.09-.43-.14-.61.14-.18.28-.7.89-.86 1.07-.16.18-.32.2-.6.07-.28-.14-1.18-.43-2.25-1.37-.83-.74-1.39-1.65-1.55-1.93-.16-.28-.02-.43.12-.57.12-.12.28-.32.41-.48.14-.16.18-.28.27-.46.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.01-.22-.53-.44-.46-.61-.46h-.52c-.18 0-.48.07-.73.34s-.96.94-.96 2.28 1 2.64 1.14 2.82c.14.18 1.96 3 4.75 4.2.66.29 1.18.46 1.58.59.66.21 1.26.18 1.74.11.53-.08 1.63-.67 1.86-1.32.23-.65.23-1.2.16-1.32-.07-.12-.25-.2-.52-.34z"/>
                <path d="M27.1 4.9C24.2 2 20.3.5 16.2.5 7.9.5 1.2 7.2 1.2 15.5c0 2.6.7 5.1 2.1 7.3L1 31l8.4-2.2c2.1 1.2 4.6 1.8 6.8 1.8 8.3 0 15-6.7 15-15 0-4.1-1.6-8-4.5-10.9zM16.2 28.6c-2 0-4.1-.5-5.9-1.5l-.4-.2-5 1.3 1.4-4.8-.3-.5c-1.3-2-2-4.4-2-6.8 0-7.2 5.9-13.1 13.1-13.1 3.5 0 6.8 1.4 9.3 3.9 2.5 2.5 3.9 5.8 3.9 9.3 0 7.2-5.9 13.1-13.1 13.1z"/>
              </svg>
            </span>
            <span class="rotulo">WhatsApp</span>
          </label>
          <label class="radio-icone">
            <input type="radio" name="contatoTipo" value="email" />
            <span class="bolinha" aria-hidden="true"></span>
            <span class="icone" title="Gmail" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M12 13 2 6.5V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6.5L12 13z"/>
                <path d="M22 6l-10 7L2 6l10-4 10 4z"/>
              </svg>
            </span>
            <span class="rotulo">Gmail</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="grupo">
        <label id="contatoLabel" for="contatoValor">Número do WhatsApp</label>
        <input type="text" id="contatoValor" name="contatoValor" inputmode="tel" placeholder="(62) 9 9999-9999" required />
        <small class="ajuda" id="contatoAjuda">Use DDD. Ex.: (62) 9 9999-9999</small>
      </fieldset>

      <fieldset class="grupo">
        <label for="descricao">Descrição do pedido</label>
        <textarea id="descricao" name="descricao" rows="6" placeholder="Explique o que você deseja: material (MDF), espessura, tamanho, quantidade, gravação em copo, referência de foto, prazos, etc." required></textarea>
      </fieldset>

      <fieldset class="grupo">
        <label for="arquivos">Fotos e arquivos (opcional)</label>
        <input type="file" id="arquivos" name="arquivos" accept="image/*,.pdf,.ai,.svg,.dxf,.cdr,.zip" multiple />
        <small class="ajuda">Até 10 arquivos, 10 MB cada.</small>
        <div id="previews" class="previews" aria-live="polite"></div>
      </fieldset>

      <div class="cta">
        <button type="submit" class="btn-primary">Enviar pedido</button>
        <p class="termos">Ao enviar, você concorda com nossa <a href="#" onclick="alert('Termos a definir com você.');return false;">política de privacidade</a>.</p>
      </div>

      <output id="status" class="status" role="status" aria-live="polite"></output>
    </form>

    <footer class="rodape">
      <p>© <span id="ano"></span> Corte a Laser & Gravações — Feito com ♥ em Goiás</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
